name: Go CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Pull your Go code into the runner
      - name: Checkout Code
        uses: actions/checkout@v4

      # Step 2: Set up the Go environment
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22' # <-- Change this to match your go.mod version

      # Step 3: Fetch dependencies (equivalent to npm install)
      - name: Install Dependencies
        run: go mod download

      # Step 4: Run your Go tests
      - name: Run Tests
        run: go test -v ./...

      # Step 5: Verify the app compiles successfully
      - name: Build Binary
        run: go build -v ./...
